name: Duplicate merged PRs to production-netlify

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  duplicate-merged-pr:
    name: Duplicate merged PR into production-netlify
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - id: create-branch
        name: Create deployment branch from merge commit
        run: |
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            MERGE_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          PR_NUMBER=${{ github.event.pull_request.number }}
          SHORT_SHA=$(echo "$MERGE_SHA" | cut -c1-7)
          BRANCH="deploy/pr-${PR_NUMBER}-${SHORT_SHA}"
          echo "Creating branch $BRANCH at $MERGE_SHA"
          git branch -f "$BRANCH" "$MERGE_SHA"
          git push origin "$BRANCH":"$BRANCH" --force
          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create deployment PR targeting production-netlify
        uses: actions/github-script@v7
        env:
          DEPLOY_BRANCH: ${{ steps.create-branch.outputs.BRANCH }}
        with:
          script: |
            const orig = context.payload.pull_request || {}
            const prNumber = orig.number
            const origTitle = orig.title || `PR #${prNumber}`
            const origBody = orig.body || ''
            const origUrl = orig.html_url || ''
            const head = process.env.DEPLOY_BRANCH
            const base = 'production-netlify'
            const title = `[Deployment] ${origTitle}`
            const body = `[Deployment]\n\nOriginal PR: ${origUrl}\n\n` + origBody

            // Check for existing open PR from this head -> base
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base,
            })

            if (existing && existing.length > 0) {
              console.log('An open deployment PR already exists:', existing[0].html_url)
              return existing[0].html_url
            }

            const { data: newPr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base,
              title,
              body,
            })
            console.log('Created deployment PR:', newPr.html_url)
            return newPr.html_url
